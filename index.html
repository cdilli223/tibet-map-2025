<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map Starter</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Elegant display font for title and map (load 400/700/900 weights) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Prevent site-wide horizontal overflow */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }
        #map {
            height: 80vh; /* slightly shorter to avoid overflow */
            max-height: calc(100vh - 8rem);
            z-index: 0;
            position: relative; /* allow absolutely positioned overlay inside */
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
            background: #d2c396; /* subtle dark background around image  */
        }
        .map-frame {
            border-radius: 0.75rem;
            overflow: hidden; /* ensure rounded corners clip overlay */
        }
        /* High-contrast, always-visible POI marker */
        .leaflet-div-icon.poi-marker {
            width: 16px !important;
            height: 16px !important;
            border-radius: 9999px !important;
            background-color: #ffca39 !important; /* fill color */
            border: 2px solid #efdf66 !important; /* outline color */
            box-shadow: 0 2px 6px rgba(0,0,0,0.9) !important;
        }
        .leaflet-div-icon.poi-marker:hover {
            background-color: #eb91ff !important;
        }

        /* Optional: style tweak for the Home control button */
        .home-control a.home-btn {
            font-size: 18px;
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            background: #a7d7fc;
            color: #111827;
        }

        /* Year navigation control styling */
        .year-control { display: inline-flex; flex-direction: column; align-items: stretch; background: rgba(255, 250, 235, 0.95); border: 1px solid #f3d0a6; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); padding: 2px 8px; }
        .year-row { display: flex; align-items: center; justify-content: center; gap: 6px; height: 26px; }
        .year-control a.year-btn {
            font-size: 13px;
            width: 28px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            background: #fef3c7; /* amber-100 */
            color: #111827;
            display: flex; align-items: center; justify-content: center;
        }
        .year-control a.year-btn.disabled { opacity: 0.4; pointer-events: none; }
        /* Year display control styling */
        .year-display { padding: 0 12px; background: #fff7ed; color: #1f2937; font-weight: 700; min-width: 90px; text-align: center; height: 20px; display:flex; align-items:center; justify-content:center; border-left: 1px solid #f3d0a6; border-right: 1px solid #f3d0a6; font-size: 13px; }
        /* Tibetan year label below the slider */
        .year-tibetan {
            width: 100%;
            text-align: center;
            font-weight: 600;
            color: #0f172a;
            height: 20px; /* match slider/button height */
            line-height: 20px; /* vertically center text */
            font-size: 13px; /* match year-display font size */
            background: rgba(255, 250, 235, 0.95); /* match control bg */
            border-top: 1px solid #f3d0a6; /* subtle separation from slider row */
            border-radius: 0 0 6px 6px; /* rounded bottom corners to match control */
        }

        /* Corner padding for Leaflet control containers (adjust as needed) */
        .leaflet-top.leaflet-left { padding-top: 20px; padding-left: 16px; }
        .leaflet-top.leaflet-right { padding-top: 20px; padding-right: 16px; }
        .leaflet-bottom.leaflet-left { padding-bottom: 20px; padding-left: 16px; }
        .leaflet-bottom.leaflet-right { padding-bottom: 20px; padding-right: 16px; }

        /* Fine-grained margins on specific controls */
        .home-control { margin: 0 6px; }
        .year-control { margin: 0 6px; }

        /* Keep Leaflet controls above custom image layer */
        .leaflet-top, .leaflet-bottom { z-index: 500 !important; }
        /* Ensure popups/tooltips render above image */
        .leaflet-popup-pane, .leaflet-tooltip-pane { z-index: 600 !important; }
        /* Title badge styling: align toward back (bottom) and apply vertical fade */
        #title-badge {
            object-position: center bottom;
            /* vertical fade using CSS mask for smooth top/bottom blending */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
        }
        /* Map elements use the elegant display font (normal weight) */
        .leaflet-container,
        .leaflet-popup-content,
        .leaflet-tooltip,
        .leaflet-control {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            letter-spacing: 0.01em;
        }
        /* Bold names, normal bodies inside map popups/tooltips */
        .leaflet-popup-content .map-title,
        .leaflet-tooltip.map-tooltip-title {
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .leaflet-popup-content .map-body { font-weight: 400; }

        /* Lift-off effect for markers when returning Home */
        @keyframes liftOffMarkers {
            0% { transform: scale(0.85); opacity: 0.6; }
            60% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1.0); opacity: 1.0; }
        }
        .lift-off .leaflet-marker-pane .leaflet-marker-icon,
        .lift-off .leaflet-marker-pane .leaflet-div-icon {
            animation: liftOffMarkers 600ms ease-out both;
            will-change: transform, opacity;
        }

        /* Smooth fade-in for markers when returning Home */
        .leaflet-marker-pane { transition: opacity 600ms ease; }
        .markers-fade .leaflet-marker-pane { opacity: 0; }
    </style>
    <!-- Leaflet CSS (without SRI to avoid preview/CDN quirks) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#c3997d] font-serif p-4 sm:p-6">
    <header class="text-center mb-6">
        <div class="relative inline-block px-3 py-2">
            <!-- Background badge behind text -->
            <img id="title-badge" src="" alt="Title Badge" class="absolute inset-0 w-full h-full object-contain opacity-0 pointer-events-none" style="z-index:0;" />
            <div class="relative" style="z-index:1;">
                <h1 class="text-3xl sm:text-4xl font-bold text-teal-950 font-display tracking-wider">Historical Hydrology of Tibet</h1>
            </div>
        </div>
    </header>
    <div class="map-frame" style="max-width:100vw;">
        <div id="map" class="w-full" style="max-width:100vw;">
            <!-- Static full-size POI image layer (not tied to Leaflet zoom) -->
            <div id="poi-image-layer" style="position:absolute; inset:0; pointer-events:none; z-index:300;">
                <img id="poi-image" alt="POI Image" style="width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity 600ms ease;" />
                    <img id="poi-image" alt="POI Image" style="width:100%; height:100%; object-fit:contain; object-position:center center; opacity:0; transition:opacity 600ms ease; transform-origin:50% 50%;" />
            </div>
        </div>
    </div>
    <footer class="text-center mt-4 text-gray-500 text-sm">
        Images Sourced from Google Earth and Public Domain Archives
    </footer>
    <!-- Leaflet JS (without SRI to avoid preview/CDN quirks) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    <script>
        // Image map config (auto-detects size; falls back if needed)
        const IMAGE_URL = 'images/tibet_2020.jpg';
        // Optional title badge image; set the path when provided
        const TITLE_BADGE_URL = 'images/Avalokitesvara.jpg';
        // Scale factor for the title badge behind text (1.0 = natural size)
        const TITLE_BADGE_SCALE = 15;
        // Optional global hi-res image (same aspect ratio)
        // const HIRES_IMAGE_URL = 'images/Tibet-Current-2x.jpg';
        // Optional region-specific hi-res patches: pixel bounds and image URLs
        // Define regions in image pixel coordinates: [[y1, x1], [y2, x2]]
        // Example shape shown below; keep as [] if unused
        const REGION_HIRES = [];
        const FALLBACK_WIDTH = 2900;
        const FALLBACK_HEIGHT = 1500;
        const MAP_ID = 'map';
        // Candidate years to step through; adjust to your dataset
        const YEAR_CANDIDATES = [1984, 1990, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2010, 2020];
        // Example points of interest: pixel coords with optional zoom image and info
        const POIS = [
            {
                name: 'Himalaya Mountains',
                xy: [230, 1100],
                overlayBounds: [[200,1060],[260,1140]], // cropped region for detail overlay
                image: 'images/himalaya_1984.jpg',
                info: 'Himalayan range overview.',
                scale: 0.98
            },
            {
                name: 'Central Tibetan Lakes',
                xy: [620, 1325],
                overlayBounds: [[580,1285],[660,1365]],
                image: 'images/central_lakes_1984.jpg',
                info: 'Central Tibetan lakes cluster.',
                scale: 0.98
            },
            {
                name: 'Arunachal Pradesh Border',
                xy: [310, 2160],
                overlayBounds: [[280,2120],[340,2200]],
                image: 'images/arunachal_1984.jpg',
                info: 'Eastern border area detail.',
                scale: 0.98
            },
            {
                name: 'Kanbula',
                xy: [1020, 2600],
                overlayBounds: [[980,2560],[1060,2640]],
                image: 'images/kanbula_1984.jpg',
                info: 'Kanbula region detail.',
                scale: 0.98
            },
            {
                name: 'Yurba',
                xy: [950, 1350],
                overlayBounds: [[920, 1310], [980, 1390]],
                image: 'images/yurba_1984.jpg',
                info: 'Yurba lake detail.',
                scale: 0.98
            }
        ];

        window.onload = function() {
            try {
                // Load title badge if URL is set
                (function(){
                    if (TITLE_BADGE_URL) {
                        const badgeImg = document.getElementById('title-badge');
                        if (badgeImg) {
                            badgeImg.onload = function(){
                                badgeImg.style.opacity = '0.4';
                                badgeImg.style.transform = `scale(${TITLE_BADGE_SCALE})`;
                                badgeImg.style.transformOrigin = '50% 50%';
                            };
                            badgeImg.onerror = function(){ badgeImg.style.opacity = '0'; };
                            badgeImg.src = TITLE_BADGE_URL;
                        }
                    }
                })();
                const imgProbe = new Image();
                imgProbe.onload = function() {
                    const imgW = imgProbe.naturalWidth || FALLBACK_WIDTH;
                    const imgH = imgProbe.naturalHeight || FALLBACK_HEIGHT;
                    const bounds = [[0, 0], [imgH, imgW]];

                    const map = L.map(MAP_ID, {
                        crs: L.CRS.Simple,
                        zoomSnap: 0.0,
                        zoomDelta: 0.5,
                        wheelPxPerZoomLevel: 120,
                        zoomControl: false,          // hide +/- controls
                        scrollWheelZoom: false,      // disable manual zoom
                        doubleClickZoom: false,
                        touchZoom: false,
                        boxZoom: false,
                        keyboard: false,
                        attributionControl: false,
                        minZoom: -1.1, // allow zooming out to see full image
                        maxZoom: 1.5,  // cap zoom-in to prevent pixelation blowout
                        maxBoundsViscosity: 1.0,     // hard stop at image edges
                        inertia: false               // prevent kinetic overscroll
                    });

                    // Fit and constrain to image bounds (no extra pad to avoid side panning)
                    map.fitBounds(bounds, { padding: [16, 16] });
                    map.setMaxBounds(L.latLngBounds(bounds));

                    // Base overlay
                    let baseOverlay = L.imageOverlay(IMAGE_URL, bounds, {
                        className: 'rounded-lg shadow-xl',
                        opacity: 0.98,
                        interactive: false,
                        zIndex: 200
                    }).addTo(map);
                    // Track home image info for year navigation
                    const homeInfo = (function(){
                        const m = IMAGE_URL.split('/').pop().match(/^(.+?)_(\d{3,4})\.(jpg|jpeg|png|webp)$/i);
                        if (m) return { base: m[1], year: parseInt(m[2],10), ext: m[3].toLowerCase() };
                        const m2 = IMAGE_URL.split('/').pop().match(/^(.+?)\.(jpg|jpeg|png|webp)$/i);
                        if (m2) return { base: m2[1], year: null, ext: m2[2].toLowerCase() };
                        return { base: 'tibet', year: null, ext: 'jpg' };
                    })();
                    let currentHomeBase = homeInfo.base;
                    let currentHomeYear = homeInfo.year; // e.g., 2020
                    let currentHomeExt = homeInfo.ext || 'jpg';

                    // Optional hi-res overlay preloaded and swapped in on zoom
                    let hiresOverlay = null;
                    if (typeof HIRES_IMAGE_URL !== 'undefined' && HIRES_IMAGE_URL) {
                        const hiImg = new Image();
                        hiImg.onload = function() {
                            hiresOverlay = L.imageOverlay(HIRES_IMAGE_URL, bounds, {
                                className: 'rounded-lg shadow-xl',
                                opacity: 0.98,
                                interactive: false,
                                zIndex: 200
                            });
                        };
                        hiImg.src = HIRES_IMAGE_URL;
                    }

                    // Region-specific overlays (preload all; add when viewport intersects)
                    const regionOverlays = [];
                    if (Array.isArray(REGION_HIRES)) {
                        REGION_HIRES.forEach(r => {
                            const ri = new Image();
                            ri.onload = function() {
                                const ro = L.imageOverlay(r.url, r.bounds, {
                                    className: 'rounded-lg shadow-xl',
                                    opacity: 0.98
                                });
                                regionOverlays.push({ name: r.name, bounds: L.latLngBounds(r.bounds), overlay: ro, active: false });
                            };
                            ri.src = r.url;
                        });
                    }

                    // Track fade state for base overlay and DOM POI image
                    let poiOverlayTimer = null;
                    let cancelFade = false; // set true to abort in-progress fades
                    const poiImgEl = document.getElementById('poi-image');
                    const poiImgLayer = document.getElementById('poi-image-layer');

                    // Track current POI image info for year navigation
                    let currentPoiBase = null; // e.g., 'himalaya'
                    let currentPoiYear = null; // e.g., 1984
                    let currentPoiExt = 'jpg'; // default extension
                    let currentPoiScale = 1.0;
                    let poiActive = false;
                    let yearPrevBtn = null, yearNextBtn = null;
                    let yearDisplayEl = null;
                    let yearTibetanEl = null;
                    const TIBETAN_YEAR_NAMES = {
                        // Provide your mapping here, e.g. 1984: '༡༩༨༤ ལོ་',
                        // Placeholder examples:
                        1984: 'Wood Mouse',
                        1990: 'Iron Horse',
                        1995: 'Wood Pig',
                        1996: 'Fire Mouse',
                        1997: 'Fire Ox',
                        1998: 'Earth Tiger',
                        1999: 'Earth Rabbit',
                        2000: 'Iron Dragon',
                        2001: 'Iron Snake',
                        2002: 'Water Horse',
                        2010: 'Iron Tiger',
                        2020: 'Iron Mouse'
                    };

                    function updateYearButtons() {
                        if (!yearPrevBtn || !yearNextBtn) return;
                        // Enable year buttons if either POI is active or home image has a year
                        const enable = (poiActive && currentPoiBase) || (currentHomeBase && (currentHomeYear != null || YEAR_CANDIDATES.length));
                        if (enable) {
                            yearPrevBtn.classList.remove('disabled');
                            yearNextBtn.classList.remove('disabled');
                        } else {
                            yearPrevBtn.classList.add('disabled');
                            yearNextBtn.classList.add('disabled');
                        }
                    }

                    function setYearDisplay() {
                        if (!yearDisplayEl) return;
                        if (poiActive && currentPoiBase) {
                            yearDisplayEl.textContent = (currentPoiYear != null) ? String(currentPoiYear) : '—';
                        } else {
                            yearDisplayEl.textContent = (currentHomeYear != null) ? String(currentHomeYear) : '—';
                        }
                        // Tibetan label below
                        if (yearTibetanEl) {
                            const y = poiActive && currentPoiBase ? currentPoiYear : currentHomeYear;
                            yearTibetanEl.textContent = (y != null && TIBETAN_YEAR_NAMES[y]) ? TIBETAN_YEAR_NAMES[y] : '—';
                        }
                    }

                    function parseImageInfo(url) {
                        try {
                            const name = url.split('/').pop();
                            if (!name) return null;
                            const m = name.match(/^(.+?)_(\d{3,4})\.(jpg|jpeg|png|webp)$/i);
                            if (m) {
                                return { base: m[1], year: parseInt(m[2], 10), ext: m[3].toLowerCase() };
                            }
                            const m2 = name.match(/^(.+?)\.(jpg|jpeg|png|webp)$/i);
                            if (m2) {
                                return { base: m2[1], year: null, ext: m2[2].toLowerCase() };
                            }
                        } catch (e) {}
                        return null;
                    }

                    function findNextYear(curr) {
                        if (curr == null) return YEAR_CANDIDATES[0] || null;
                        for (let i = 0; i < YEAR_CANDIDATES.length; i++) {
                            if (YEAR_CANDIDATES[i] > curr) return YEAR_CANDIDATES[i];
                        }
                        return null;
                    }
                    function findPrevYear(curr) {
                        if (curr == null) return YEAR_CANDIDATES[YEAR_CANDIDATES.length - 1] || null;
                        for (let i = YEAR_CANDIDATES.length - 1; i >= 0; i--) {
                            if (YEAR_CANDIDATES[i] < curr) return YEAR_CANDIDATES[i];
                        }
                        return null;
                    }

                    function crossfadePoiToUrl(newUrl) {
                        if (!poiImgEl || !newUrl) return;
                        const ghost = document.createElement('img');
                        ghost.src = poiImgEl.src || '';
                        ghost.alt = 'POI Ghost';
                        ghost.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center center; pointer-events:none; transform-origin:50% 50%; opacity:1; transition:opacity 400ms ease;';
                        if (currentPoiScale) ghost.style.transform = `scale(${currentPoiScale})`;
                        poiImgLayer.appendChild(ghost);

                        const loader = new Image();
                        loader.onload = function () {
                            // Prepare live image beneath ghost
                            if (currentPoiScale) poiImgEl.style.transform = `scale(${currentPoiScale})`;
                            poiImgEl.style.opacity = '0';
                            poiImgEl.src = newUrl;
                            // Wait a tick to ensure DOM applied
                            requestAnimationFrame(() => {
                                poiImgEl.style.opacity = '1';
                                // Fade ghost out and remove
                                requestAnimationFrame(() => {
                                    ghost.style.opacity = '0';
                                    setTimeout(() => ghost.remove(), 420);
                                });
                            });
                        };
                        loader.onerror = function(){ console.warn('Failed to load year image:', newUrl); };
                        loader.src = newUrl;
                    }

                    function goToYear(targetYear) {
                        if (!currentPoiBase || !targetYear) return;
                        const url = `images/${currentPoiBase}_${targetYear}.${currentPoiExt || 'jpg'}`;
                        crossfadePoiToUrl(url);
                        currentPoiYear = targetYear;
                        setYearDisplay();
                    }

                    // Store map reference for resize handler
                    const mapDivRef = document.getElementById(MAP_ID);
                    if (mapDivRef) {
                        mapDivRef._leaflet_map = map;
                    }

                    // Ensure proper render after layout
                    setTimeout(() => map.invalidateSize(), 0);

                    // Minimal click popup with pixel coords (optional)
                    map.on('click', function(e) {
                        const y = e.latlng.lat.toFixed(0);
                        const x = e.latlng.lng.toFixed(0);
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent(`<small>Pixel X: ${x}, Y: ${y}</small>`)
                            .openOn(map);
                    });

                    // Add markers and behavior to zoom and show info/alt image
                    const markerLayer = L.layerGroup().addTo(map);
                    const initialZoom = map.getZoom();
                    const fadeDuration = 600; // ms (keep in sync with fly duration)
                    const initialCenter = [imgH/2, imgW/2];
                    POIS.forEach(p => {
                        const icon = L.divIcon({
                            className: 'leaflet-div-icon poi-marker',
                            iconSize: [16,16],
                            iconAnchor: [8,8]
                        });
                        const m = L.marker(p.xy, { icon, riseOnHover: true }).addTo(markerLayer);
                        m.bindTooltip(p.name, { permanent: false, className: 'map-tooltip-title' });
                        m.on('click', () => {
                            // Zoom the map to frame the POI area, then crossfade to a static full-size image
                            const flyDuration = 0.9; // seconds (sync with fadeDuration)
                            const hasBounds = Array.isArray(p.overlayBounds) && p.overlayBounds.length === 2;
                            if (hasBounds && !p.preferPointCenter) {
                                map.flyToBounds(p.overlayBounds, { animate: true, duration: flyDuration, padding: [16, 16] });
                            } else {
                                const preZoom = map.getZoom();
                                const approachZoom = Math.min(preZoom + 1.0, map.getMaxZoom());
                                map.flyTo(p.xy, approachZoom, { animate: true, duration: flyDuration });
                            }

                            // Crossfade from base map to static full-size POI image (DOM overlay), no zoom on image
                            if (p.image && poiImgEl) {
                                const loader = new Image();
                                    // Apply optional per-POI scale (defaults to 1.0)
                                    const scale = typeof p.scale === 'number' ? p.scale : 1.0;
                                    poiImgEl.style.transform = `scale(${scale})`;
                                    currentPoiScale = scale;
                                    const info = parseImageInfo(p.image);
                                    if (info) {
                                        currentPoiBase = info.base;
                                        currentPoiYear = info.year;
                                        currentPoiExt = info.ext || 'jpg';
                                    } else {
                                        currentPoiBase = null;
                                        currentPoiYear = null;
                                        currentPoiExt = 'jpg';
                                    }
                                loader.onload = function() {
                                    poiImgEl.src = p.image;
                                    // Start simultaneous crossfade immediately so fade-in and fade-out happen together
                                    cancelFade = false;
                                    const start = performance.now();
                                    function fadeIn(ts) {
                                        let prog = (ts - start) / fadeDuration;
                                        if (prog > 1) prog = 1;
                                        if (cancelFade) prog = 1;
                                        baseOverlay.setOpacity(0.98 * (1 - prog));
                                        poiImgEl.style.opacity = String(prog);
                                        if (!cancelFade && prog < 1) {
                                            requestAnimationFrame(fadeIn);
                                        }
                                    }
                                    requestAnimationFrame(fadeIn);
                                    poiActive = true;
                                    updateYearButtons();
                                    setYearDisplay();
                                };
                                loader.onerror = function() {
                                    console.error('POI image failed to load:', p.image);
                                    L.popup()
                                        .setLatLng(p.xy)
                                        .setContent(`<div class='text-sm text-red-600'>Image not found: ${p.image}</div>`)
                                        .openOn(map);
                                };
                                loader.src = p.image;
                            }

                            // Show info popup
                            L.popup()
                                .setLatLng(p.xy)
                                .setContent(`<div class="text-xs"><div class="map-title mb-1">${p.name}</div><div class="map-body">${p.info || ''}</div></div>`)
                                .openOn(map);
                        });
                    });

                    // Home button control to restore full view and overlays
                    function goHome() {
                        // Simultaneous fade: base overlay fades in while POI image fades out
                        const duration = 1.4 * fadeDuration; // keep in sync with marker lift-off
                        cancelFade = false;
                        // Leaving POI mode: disable year navigation and clear POI context
                        poiActive = false;
                        currentPoiBase = null;
                        currentPoiYear = null;
                        updateYearButtons();
                        setYearDisplay();

                        // Attach lift-off class to map for marker animation
                        const mapContainer = document.getElementById(MAP_ID);
                        if (mapContainer) {
                            mapContainer.classList.add('lift-off');
                            setTimeout(() => mapContainer.classList.remove('lift-off'), duration);
                        }

                        // Ensure base overlay is present
                        if (!map.hasLayer(baseOverlay)) {
                            baseOverlay.addTo(map);
                        }

                        // If hires overlay is active, swap back to base
                        if (hiresOverlay && map.hasLayer(hiresOverlay)) {
                            map.removeLayer(hiresOverlay);
                        }

                        // Deactivate any region overlays
                        regionOverlays.forEach(r => {
                            if (r.active) {
                                map.removeLayer(r.overlay);
                                r.active = false;
                            }
                        });

                        // Close any open popups
                        map.closePopup();

                        // Animate fade between POI image and base overlay
                        const startOpacityBase = typeof baseOverlay.options.opacity === 'number' ? baseOverlay.options.opacity : 0.98;
                        const start = performance.now();
                        function crossfade(ts) {
                            let prog = (ts - start) / duration;
                            if (prog > 1) prog = 1;
                            if (cancelFade) prog = 1;
                            // Fade IN base overlay toward full opacity
                            const baseOpacity = 0.98 * prog + startOpacityBase * (1 - prog);
                            baseOverlay.setOpacity(baseOpacity);
                            // Fade OUT POI image
                            if (poiImgEl) {
                                const poiOpacity = (1 - prog);
                                poiImgEl.style.opacity = String(poiOpacity);
                                if (prog === 1) {
                                    // optional: clear src after fade completes
                                    poiImgEl.src = '';
                                }
                            }
                            if (!cancelFade && prog < 1) {
                                requestAnimationFrame(crossfade);
                            }
                        }
                        requestAnimationFrame(crossfade);

                        // Fly out to full bounds to create zoom-out/lift-off feel
                        map.flyToBounds(bounds, { animate: true, duration: duration / 1000, padding: [15, 15] });

                        // Fade markers back in synchronized with the end of the fly animation
                        const mapContainer2 = document.getElementById(MAP_ID);
                        if (mapContainer2) {
                            // Start from 0 opacity during the Home transition
                            mapContainer2.classList.add('markers-fade');
                            // When zoom/fly ends, remove the class to trigger fade-in
                            const once = (ev) => {
                                // small delay to ensure Leaflet finishes DOM class toggles
                                setTimeout(() => {
                                    mapContainer2.classList.remove('markers-fade');
                                }, 20);
                                map.off('zoomend', once);
                                map.off('moveend', once);
                            };
                            map.on('zoomend', once);
                            map.on('moveend', once);
                        }
                    }

                    const HomeControl = L.Control.extend({
                        options: { position: 'bottomleft' },
                        onAdd: function() {
                            const container = L.DomUtil.create('div', 'leaflet-bar home-control');
                            const btn = L.DomUtil.create('a', 'home-btn', container);
                            btn.href = '#';
                            btn.title = 'Reset view';
                            btn.innerHTML = 'ཡུལ';
                            L.DomEvent.on(btn, 'click', L.DomEvent.stop)
                                     .on(btn, 'click', function() { goHome(); });
                            return container;
                        }
                    });
                    new HomeControl().addTo(map);

                    // Year navigation control (Prev/Next)
                    function stepYear(direction) {
                        // If a POI image is active, step that
                        if (poiActive && currentPoiBase) {
                            const currY = currentPoiYear;
                            const candidatesPoi = (function(){
                                if (currY == null) {
                                    return direction > 0 ? YEAR_CANDIDATES.slice(0) : YEAR_CANDIDATES.slice(0).reverse();
                                }
                                return direction > 0 ? YEAR_CANDIDATES.filter(y => y > currY) : YEAR_CANDIDATES.filter(y => y < currY).reverse();
                            })();
                            (function tryNextPoi(i){
                                if (i >= candidatesPoi.length) return;
                                const y = candidatesPoi[i];
                                const testUrl = `images/${currentPoiBase}_${y}.${currentPoiExt || 'jpg'}`;
                                const test = new Image();
                                test.onload = function(){ goToYear(y); };
                                test.onerror = function(){ tryNextPoi(i+1); };
                                test.src = testUrl;
                            })(0);
                            return;
                        }

                        // Otherwise, step the home image overlay
                        if (!currentHomeBase) return;
                        const curr = currentHomeYear;
                        const candidatesHome = (function(){
                            if (curr == null) {
                                // If no current year, try full list in direction
                                return direction > 0 ? YEAR_CANDIDATES.slice(0) : YEAR_CANDIDATES.slice(0).reverse();
                            }
                            return direction > 0 ? YEAR_CANDIDATES.filter(y => y > curr) : YEAR_CANDIDATES.filter(y => y < curr).reverse();
                        })();
                        (function tryNextHome(i){
                            if (i >= candidatesHome.length) return;
                            const y = candidatesHome[i];
                            const testUrl = `images/${currentHomeBase}_${y}.${currentHomeExt || 'jpg'}`;
                            const test = new Image();
                            test.onload = function(){
                                // Crossfade baseOverlay to new URL
                                const ghost = L.imageOverlay(baseOverlay._url, baseOverlay.getBounds(), { opacity: baseOverlay.options.opacity || 0.98, zIndex: (baseOverlay.options.zIndex || 200) + 1 });
                                ghost.addTo(map);
                                baseOverlay.setUrl(testUrl);
                                currentHomeYear = y;
                                let prog = 0;
                                const start = performance.now();
                                function fade(ts){
                                    prog = Math.min(1, (ts - start) / 400);
                                    ghost.setOpacity(1 - prog);
                                    if (prog < 1) requestAnimationFrame(fade); else map.removeLayer(ghost);
                                }
                                requestAnimationFrame(fade);
                                updateYearButtons();
                                setYearDisplay();
                            };
                            test.onerror = function(){ tryNextHome(i+1); };
                            test.src = testUrl;
                        })(0);
                    }

                    const YearControl = L.Control.extend({
                        options: { position: 'topleft' },
                        onAdd: function() {
                            const container = L.DomUtil.create('div', 'leaflet-bar year-control');
                            const row = L.DomUtil.create('div', 'year-row', container);
                            const prev = L.DomUtil.create('a', 'year-btn', row);
                            prev.href = '#';
                            prev.title = 'Previous year';
                            prev.innerHTML = '‹';
                            const display = L.DomUtil.create('div', 'year-display', row);
                            display.innerHTML = '&nbsp;';
                            const next = L.DomUtil.create('a', 'year-btn', row);
                            next.href = '#';
                            next.title = 'Next year';
                            next.innerHTML = '›';
                            const tib = L.DomUtil.create('div', 'year-tibetan', container);
                            tib.textContent = '—';
                            yearPrevBtn = prev;
                            yearNextBtn = next;
                            yearDisplayEl = display;
                            yearTibetanEl = tib;
                            L.DomEvent.on(prev, 'click', L.DomEvent.stop)
                                     .on(prev, 'click', function(){ stepYear(-1); });
                            L.DomEvent.on(next, 'click', L.DomEvent.stop)
                                     .on(next, 'click', function(){ stepYear(1); });
                            updateYearButtons();
                            setYearDisplay();
                            return container;
                        }
                    });
                    new YearControl().addTo(map);

                    // Swap overlays at higher zoom for sharper detail
                    const SWAP_ZOOM = 0.75; // threshold when global hi-res kicks in
                    let usingHires = false;
                    map.on('zoomend', function() {
                        const z = map.getZoom();
                        if (hiresOverlay) {
                            if (z >= SWAP_ZOOM && !usingHires) {
                                map.removeLayer(baseOverlay);
                                hiresOverlay.addTo(map);
                                usingHires = true;
                            } else if (z < SWAP_ZOOM && usingHires) {
                                map.removeLayer(hiresOverlay);
                                baseOverlay.addTo(map);
                                usingHires = false;
                            }
                        }

                        // Region overlays: activate when zoomed in and viewport intersects region
                        const VIEW_ZOOM = 0.9; // only show patches when quite zoomed in
                        const viewBounds = map.getBounds();
                        regionOverlays.forEach(r => {
                            const intersects = viewBounds.intersects(r.bounds);
                            if (z >= VIEW_ZOOM && intersects && !r.active) {
                                r.overlay.addTo(map);
                                r.active = true;
                            } else if ((z < VIEW_ZOOM || !intersects) && r.active) {
                                map.removeLayer(r.overlay);
                                r.active = false;
                            }
                        });
                    });
                };
                imgProbe.onerror = function() {
                    console.error('Image failed to load at', IMAGE_URL);
                    const mapDiv = document.getElementById(MAP_ID);
                    if (mapDiv) {
                        mapDiv.innerHTML = '<div class="p-6 bg-red-100 text-red-700 text-center rounded-lg">Image not found: ' + IMAGE_URL + '</div>';
                    }
                };
                imgProbe.src = IMAGE_URL;

            } catch (error) {
                console.error('Failed to initialize Leaflet image map:', error);
                const mapDiv = document.getElementById(MAP_ID);
                if (mapDiv) {
                    mapDiv.innerHTML = '<div class="p-6 bg-red-100 text-red-700 text-center rounded-lg">Error loading map. Check console for details.</div>';
                }
            }
        };

        // Ensures the map is rendered correctly on window resize
        window.onresize = function() {
            const mapDiv = document.getElementById(MAP_ID);
            if (mapDiv && mapDiv._leaflet_map) {
                mapDiv._leaflet_map.invalidateSize();
            }
        }
    </script>
</body>
</html>
